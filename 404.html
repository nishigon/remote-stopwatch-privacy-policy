<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Remote Stopwatch Privacy Policy</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --panel: #fffaf3;
      --text: #1f2a33;
      --muted: #5c6b74;
      --accent: #2457d6;
      --border: rgba(31, 42, 51, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 18px 50px rgba(31, 42, 51, 0.10);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 3rem); }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.7; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--accent);
      background: white;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Page not found</h1>
    <p>The requested page does not exist. Use the home page or one of the language pages below to continue.</p>
    <div class="links">
      <a href="./">Home</a>
      <a href="./en/">English</a>
      <a href="./ko/">한국어</a>
      <a href="./zh-cn/">简体中文</a>
      <a href="./zh-tw/">繁體中文</a>
    </div>
  </main>
</body>
</html>
