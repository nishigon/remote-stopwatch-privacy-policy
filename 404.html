<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません - Remote Stopwatch</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --panel: #ffffff;
      --text: #1c2430;
      --muted: #5c6675;
      --border: #d8dee8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
    }
    h1 { margin: 0 0 14px; font-size: clamp(2rem, 4vw, 3rem); }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.8; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #bfc7d3;
      border-radius: 999px;
      background: white;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>ページが見つかりません</h1>
    <p>指定されたページは存在しません。日本語トップ、または各言語ページへ戻ってください。</p>
    <div class="links">
      <a href="./">日本語トップ</a>
      <a href="./en/">English</a>
      <a href="./zh-cn/">简体中文</a>
      <a href="./zh-tw/">繁體中文</a>
      <a href="./ko/">한국어</a>
    </div>
  </main>
</body>
</html>
